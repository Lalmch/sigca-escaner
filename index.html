<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Escáner QR - SIGCA</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

.contenedor {
    max-width: 650px;
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.15);
}

h1 {
    color: #234f9e;
    font-size: 32px;
    margin-bottom: 15px;
}

#estado {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
    min-height: 30px;
}

#lector {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
}

#lector video {
    width: 100% !important;
    border-radius: 15px;
}

#resultado {
    color: #16803c;
    font-size: 22px;
    font-weight: bold;
    margin: 15px;
    min-height: 30px;
}

.botones {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 10px;
    padding: 16px 28px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#btnIniciar {
    background: #1769e0;
    color: white;
}

#btnIniciar:disabled {
    opacity: .6;
    cursor: default;
}

#btnCancelar {
    background: #e53935;
    color: white;
}

#mensaje {
    margin-top: 18px;
    color: #666;
}

</style>
</head>

<body>

<div class="contenedor">

    <h1>📷 ESCÁNER QR</h1>

    <div id="estado">
        Presione "Iniciar cámara"
    </div>

    <div id="lector"></div>

    <div id="resultado"></div>

    <div class="botones">

        <button id="btnIniciar" type="button">
            📷 Iniciar cámara
        </button>

        <button id="btnCancelar" type="button">
            ❌ Cancelar
        </button>

    </div>

    <div id="mensaje">
        Coloque el código QR frente a la cámara.
    </div>

</div>


<script>

let lectorQR = null;
let camaraActiva = false;
let procesando = false;


//==================================================
// ELEMENTOS
//==================================================

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");

const mensaje =
    document.getElementById("mensaje");

const btnIniciar =
    document.getElementById("btnIniciar");

const btnCancelar =
    document.getElementById("btnCancelar");


//==================================================
// BOTÓN INICIAR
//==================================================

btnIniciar.addEventListener(
    "click",
    iniciarCamara
);


//==================================================
// BOTÓN CANCELAR
//==================================================

btnCancelar.addEventListener(
    "click",
    cerrarCamara
);


//==================================================
// INICIAR CÁMARA
//==================================================

async function iniciarCamara() {

    console.log("BOTÓN INICIAR PRESIONADO");

    if (camaraActiva) {
        return;
    }

    estado.textContent =
        "⏳ Iniciando cámara...";

    resultado.textContent = "";

    mensaje.textContent =
        "Solicitando permiso para utilizar la cámara...";

    btnIniciar.disabled = true;


    try {

        // Crear lector solamente una vez

        if (!lectorQR) {

            lectorQR =
                new Html5Qrcode("lector");

        }


        //==========================================
        // CONFIGURACIÓN
        //==========================================

        const configuracion = {

            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            },

            aspectRatio: 1.0

        };


        //==========================================
        // INICIAR CÁMARA TRASERA
        //==========================================

        await lectorQR.start(

            {
                facingMode: "environment"
            },

            configuracion,

            function(codigo) {

                codigoDetectado(codigo);

            },

            function(error) {

                // Errores normales de lectura.
                // No mostramos nada.

            }

        );


        //==========================================
        // CÁMARA ACTIVA
        //==========================================

        camaraActiva = true;

        estado.textContent =
            "🟢 Cámara activa. Muestre el código QR.";

        mensaje.textContent =
            "Coloque el código QR frente a la cámara.";

        btnIniciar.textContent =
            "🟢 Cámara activa";


        console.log(
            "CÁMARA INICIADA CORRECTAMENTE"
        );

    }

    catch(error) {

        console.error(
            "ERROR DE CÁMARA:",
            error
        );

        camaraActiva = false;

        btnIniciar.disabled = false;

        btnIniciar.textContent =
            "📷 Iniciar cámara";

        estado.textContent =
            "❌ No se pudo iniciar la cámara.";

        mensaje.textContent =
            error.message ||
            "Verifique el permiso de cámara.";

    }

}


//==================================================
// QR DETECTADO
//==================================================

async function codigoDetectado(codigo) {

    if (procesando) {
        return;
    }

    procesando = true;

    console.log(
        "QR DETECTADO:",
        codigo
    );


    estado.textContent =
        "✅ Código QR leído";

    resultado.textContent =
        "DNI: " + codigo;

    mensaje.textContent =
        "Enviando DNI a SIGCA...";


    await detenerCamara();


    enviarDNI(codigo);

}


//==================================================
// DETENER CÁMARA
//==================================================

async function detenerCamara() {

    if (!lectorQR) {
        return;
    }

    try {

        if (camaraActiva) {

            await lectorQR.stop();

        }

    }

    catch(error) {

        console.log(
            "Error deteniendo cámara:",
            error
        );

    }

    camaraActiva = false;

}


//==================================================
// ENVIAR DNI A SIGCA
//==================================================

function enviarDNI(dni) {

    console.log(
        "ENVIANDO DNI:",
        dni
    );


    //==============================================
    // VENTANA PRINCIPAL SIGCA
    //==============================================

    if (
        window.opener &&
        !window.opener.closed
    ) {

        window.opener.postMessage(

            {
                tipo: "SIGCA_QR",
                dni: dni
            },

            "*"

        );


        estado.textContent =
            "✅ DNI enviado a SIGCA";

        mensaje.textContent =
            "Regresando a SIGCA...";


        setTimeout(
            function() {

                window.close();

            },
            1000
        );

        return;

    }


    //==============================================
    // SI SE ABRIÓ DIRECTAMENTE
    //==============================================

    estado.textContent =
        "✅ Escaneo completado";

    mensaje.textContent =
        "DNI leído correctamente.";

}


//==================================================
// CERRAR
//==================================================

async function cerrarCamara() {

    procesando = true;

    estado.textContent =
        "Cerrando cámara...";

    await detenerCamara();

    setTimeout(
        function() {

            window.close();

        },
        500
    );

}

</script>

</body>
</html>
