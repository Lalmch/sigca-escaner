<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escáner QR - SIGCA</title>

<!-- LIBRERÍA PARA ESCANEAR QR -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  text-align: center;
}

.contenedor {
  width: 100%;
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.15);
}

h1 {
  color: #234f9e;
  margin-bottom: 15px;
  font-size: 34px;
}

.estado {
  font-size: 20px;
  font-weight: bold;
  margin: 15px 0;
  min-height: 30px;
}

#lector {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
}

#lector video {
  width: 100% !important;
  border-radius: 15px;
}

.resultado {
  font-size: 22px;
  font-weight: bold;
  color: #16803c;
  margin: 15px 0;
  min-height: 30px;
}

.botones {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 20px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 16px 28px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.btn-iniciar {
  background: #1769e0;
  color: white;
}

.btn-iniciar:hover {
  background: #0d55bb;
}

.btn-cancelar {
  background: #e53935;
  color: white;
}

.btn-cancelar:hover {
  background: #c62828;
}

.btn-activa {
  background: #20a94b;
  color: white;
  cursor: default;
}

.oculto {
  display: none !important;
}

.mensaje {
  margin-top: 15px;
  color: #666;
  font-size: 16px;
}

</style>
</head>

<body>

<div class="contenedor">

  <h1>📷 ESCÁNER QR</h1>

  <div id="estado" class="estado">
    Presione "Iniciar cámara"
  </div>

  <!-- AQUÍ APARECERÁ LA CÁMARA -->
  <div id="lector"></div>

  <div id="resultado" class="resultado"></div>

  <div class="botones">

    <button
      id="btnIniciar"
      class="btn-iniciar"
      onclick="iniciarEscaner()">
      📷 Iniciar cámara
    </button>

    <button
      id="btnCancelar"
      class="btn-cancelar"
      onclick="cerrarEscaner()">
      ❌ Cancelar
    </button>

  </div>

  <div id="mensaje" class="mensaje">
    Coloque el código QR frente a la cámara.
  </div>

</div>


<script>

//==================================================
// VARIABLES
//==================================================

let html5QrCode = null;
let escaneando = false;
let iniciando = false;


//==================================================
// ELEMENTOS
//==================================================

const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");
const mensaje = document.getElementById("mensaje");
const btnIniciar = document.getElementById("btnIniciar");
const btnCancelar = document.getElementById("btnCancelar");


//==================================================
// INICIAR ESCÁNER
//==================================================

async function iniciarEscaner() {

  // Evitar doble clic
  if (escaneando || iniciando) {
    return;
  }

  iniciando = true;

  btnIniciar.disabled = true;

  estado.textContent = "⏳ Solicitando acceso a la cámara...";
  resultado.textContent = "";
  mensaje.textContent = "";

  try {

    // Crear lector
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("lector");
    }


    //==============================================
    // OBTENER CÁMARAS
    //==============================================

    const cameras = await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "No se encontró ninguna cámara disponible."
      );

    }


    console.log("Cámaras encontradas:", cameras);


    //==============================================
    // BUSCAR CÁMARA TRASERA
    //==============================================

    let camaraSeleccionada = cameras.find(function(camara) {

      const nombre =
        (camara.label || "").toLowerCase();

      return (
        nombre.includes("back") ||
        nombre.includes("rear") ||
        nombre.includes("trasera") ||
        nombre.includes("environment")
      );

    });


    // Si no encuentra trasera, usar primera cámara
    if (!camaraSeleccionada) {
      camaraSeleccionada = cameras[0];
    }


    console.log(
      "Cámara seleccionada:",
      camaraSeleccionada
    );


    //==============================================
    // CONFIGURACIÓN
    //==============================================

    const configuracion = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const minEdge = Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

        const tamaño = Math.floor(
          minEdge * 0.70
        );

        return {
          width: tamaño,
          height: tamaño
        };

      },

      aspectRatio: 1.0

    };


    //==============================================
    // INICIAR CÁMARA
    //==============================================

    await html5QrCode.start(

      camaraSeleccionada.id,

      configuracion,

      function(decodedText, decodedResult) {

        console.log(
          "QR detectado:",
          decodedText
        );

        procesarQR(decodedText);

      },

      function(errorMessage) {

        // No mostrar errores normales
        // mientras busca el código QR.

      }

    );


    //==============================================
    // CÁMARA ACTIVADA
    //==============================================

    escaneando = true;
    iniciando = false;

    estado.textContent =
      "🟢 Cámara activa. Muestre el código QR.";

    resultado.textContent = "";

    mensaje.textContent =
      "Coloque el código QR frente a la cámara.";

    // Cambiar botón
    btnIniciar.textContent =
      "🟢 Cámara activa";

    btnIniciar.classList.remove(
      "btn-iniciar"
    );

    btnIniciar.classList.add(
      "btn-activa"
    );

    btnIniciar.disabled = true;


    console.log("CÁMARA INICIADA CORRECTAMENTE");

  }

  catch (error) {

    console.error(
      "Error iniciando cámara:",
      error
    );

    escaneando = false;
    iniciando = false;

    btnIniciar.disabled = false;

    estado.textContent =
      "❌ No se pudo iniciar la cámara.";

    resultado.textContent =
      obtenerMensajeError(error);

    mensaje.textContent =
      "Revise el permiso de cámara e inténtelo nuevamente.";

  }

}


//==================================================
// PROCESAR QR
//==================================================

async function procesarQR(decodedText) {

  // Evitar leer el mismo QR varias veces
  if (!escaneando) {
    return;
  }

  escaneando = false;

  console.log(
    "Código QR:",
    decodedText
  );


  //==============================================
  // MOSTRAR RESULTADO
  //==============================================

  estado.textContent =
    "✅ Código QR leído";

  resultado.textContent =
    "DNI: " + decodedText;

  mensaje.textContent =
    "Enviando DNI a SIGCA...";


  //==============================================
  // DETENER CÁMARA
  //==============================================

  await detenerEscaner();


  //==============================================
  // ENVIAR DNI
  //==============================================

  enviarDNI(decodedText);

}


//==================================================
// DETENER ESCÁNER
//==================================================

async function detenerEscaner() {

  if (!html5QrCode) {
    return;
  }

  try {

    const estadoActual =
      html5QrCode.getState();

    console.log(
      "Estado lector:",
      estadoActual
    );


    // 2 = SCANNING
    // Solo detener si realmente está escaneando

    if (estadoActual === 2) {

      await html5QrCode.stop();

      console.log(
        "Cámara detenida correctamente"
      );

    }

  }

  catch (error) {

    console.log(
      "Error al detener cámara:",
      error
    );

  }

}


//==================================================
// ENVIAR DNI A SIGCA
//==================================================

function enviarDNI(dni) {

  console.log(
    "Enviando DNI:",
    dni
  );


  //==============================================
  // SI FUE ABIERTO DESDE SIGCA
  //==============================================

  if (
    window.opener &&
    !window.opener.closed
  ) {

    try {

      window.opener.postMessage(

        {
          tipo: "SIGCA_QR",
          dni: dni
        },

        "*"

      );


      estado.textContent =
        "✅ DNI enviado a SIGCA";

      mensaje.textContent =
        "Regresando a SIGCA...";


      setTimeout(function() {

        window.close();

      }, 1000);


      return;

    }

    catch (error) {

      console.error(
        "Error enviando DNI:",
        error
      );

    }

  }


  //==============================================
  // SI SE ABRIÓ DIRECTAMENTE
  //==============================================

  estado.textContent =
    "✅ Escaneo completado";

  mensaje.textContent =
    "DNI leído: " + dni;

}


//==================================================
// CERRAR ESCÁNER
//==================================================

async function cerrarEscaner() {

  escaneando = false;
  iniciando = false;

  estado.textContent =
    "Cerrando cámara...";


  await detenerEscaner();


  setTimeout(function() {

    window.close();

  }, 500);

}


//==================================================
// MENSAJE DE ERROR
//==================================================

function obtenerMensajeError(error) {

  if (!error) {
    return "Error desconocido.";
  }

  const mensajeError =
    error.message ||
    String(error);


  if (
    mensajeError.includes("NotAllowedError")
  ) {

    return "Permiso de cámara denegado.";

  }


  if (
    mensajeError.includes("NotFoundError")
  ) {

    return "No se encontró una cámara.";

  }


  if (
    mensajeError.includes("NotReadableError")
  ) {

    return "La cámara está siendo utilizada por otro programa.";

  }


  if (
    mensajeError.includes("AbortError")
  ) {

    return "El navegador canceló el acceso a la cámara. Intente nuevamente.";

  }


  return mensajeError;

}

</script>

</body>
</html>
