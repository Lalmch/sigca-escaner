<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Escáner QR - SIGCA</title>


  <!-- =========================================
       LIBRERÍA PARA ESCANEAR QR
       ========================================= -->

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>


  <!-- =========================================
       ESTILOS
       ========================================= -->

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #eef3f8;

      text-align: center;

      color: #222;

    }


    .contenedor {

      width: 100%;

      max-width: 700px;

      margin: 0 auto;

      background: white;

      padding: 25px;

      border-radius: 18px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    }


    h1 {

      margin-top: 5px;

      margin-bottom: 15px;

      color: #174ea6;

      font-size: 32px;

    }


    .estado {

      min-height: 35px;

      margin: 15px 0;

      font-size: 20px;

      font-weight: bold;

    }


    .lector {

      width: 100%;

      max-width: 600px;

      min-height: 300px;

      margin: 20px auto;

      border-radius: 15px;

      overflow: hidden;

      background: #111;

    }


    .resultado {

      min-height: 45px;

      margin: 15px 0;

      padding: 12px;

      border-radius: 10px;

      background: #f1f5f9;

      font-size: 20px;

      font-weight: bold;

    }


    .botones {

      display: flex;

      justify-content: center;

      gap: 15px;

      flex-wrap: wrap;

      margin-top: 20px;

    }


    button {

      border: none;

      border-radius: 10px;

      padding: 14px 25px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      min-width: 190px;

    }


    .btn-iniciar {

      background: #1769e0;

      color: white;

    }


    .btn-iniciar:hover {

      background: #0d57c7;

    }


    .btn-cancelar {

      background: #d9534f;

      color: white;

    }


    .btn-cancelar:hover {

      background: #c9302c;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .info {

      margin-top: 15px;

      font-size: 14px;

      color: #666;

    }


  </style>

</head>


<body>


  <div class="contenedor">


    <!-- =======================================
         TÍTULO
         ======================================= -->

    <h1>
      📷 ESCÁNER QR
    </h1>


    <!-- =======================================
         ESTADO
         ======================================= -->

    <div
      id="estado"
      class="estado">

      Presione "Iniciar cámara"

    </div>


    <!-- =======================================
         LECTOR QR
         ======================================= -->

    <div
      id="lector"
      class="lector">
    </div>


    <!-- =======================================
         RESULTADO
         ======================================= -->

    <div
      id="resultado"
      class="resultado">

    </div>


    <!-- =======================================
         BOTONES
         ======================================= -->

    <div class="botones">

      <button
        id="btnIniciar"
        class="btn-iniciar"
        onclick="iniciarEscaner()">

        📷 Iniciar cámara

      </button>


      <button
        id="btnCancelar"
        class="btn-cancelar"
        onclick="cerrarEscaner()">

        ❌ Cancelar

      </button>

    </div>


    <div class="info">

      Coloque el código QR frente a la cámara.

    </div>


  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>


    // ==========================================
    // VARIABLES
    // ==========================================

    let html5QrCode = null;

    let escaneando = false;

    let iniciando = false;


    // ==========================================
    // ELEMENTOS
    // ==========================================

    function elemento(id) {

      return document.getElementById(id);

    }


    // ==========================================
    // MOSTRAR ESTADO
    // ==========================================

    function mostrarEstado(texto) {

      elemento("estado").textContent = texto;

    }


    // ==========================================
    // INICIAR ESCÁNER
    // ==========================================

    async function iniciarEscaner() {


      // Evitar doble clic

      if (iniciando || escaneando) {

        return;

      }


      iniciando = true;


      elemento("btnIniciar").disabled = true;


      mostrarEstado(
        "📷 Buscando cámara..."
      );


      elemento("resultado").textContent = "";


      try {


        // ----------------------------------------
        // SI EXISTE UNA INSTANCIA ANTERIOR
        // LA LIBERAMOS
        // ----------------------------------------

        if (html5QrCode) {

          try {

            await detenerEscaner();

          } catch (e) {

            console.log(
              "No había cámara activa."
            );

          }

        }


        // ----------------------------------------
        // CREAR NUEVO ESCÁNER
        // ----------------------------------------

        html5QrCode =
          new Html5Qrcode("lector");


        // ----------------------------------------
        // OBTENER CÁMARAS
        // ----------------------------------------

        const cameras =
          await Html5Qrcode.getCameras();


        console.log(
          "Cámaras encontradas:",
          cameras
        );


        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "No se encontró ninguna cámara."
          );

        }


        // ----------------------------------------
        // BUSCAR CÁMARA TRASERA
        // ----------------------------------------

        let camara = null;


        for (
          let i = 0;
          i < cameras.length;
          i++
        ) {

          const nombre =
            (
              cameras[i].label || ""
            ).toLowerCase();


          if (

            nombre.includes("back") ||

            nombre.includes("rear") ||

            nombre.includes("trasera")

          ) {

            camara = cameras[i];

            break;

          }

        }
