<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Escáner QR - SIGCA</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {

    margin: 0;
    padding: 20px;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    text-align: center;

}

.contenedor {

    max-width: 650px;

    margin: 30px auto;

    padding: 30px;

    background: white;

    border-radius: 18px;

    box-shadow: 0 5px 25px rgba(0,0,0,.15);

}

h1 {

    color: #234f9e;

    font-size: 32px;

    margin-bottom: 15px;

}

#estado {

    font-size: 20px;

    font-weight: bold;

    margin: 20px 0;

    min-height: 30px;

}

#lector {

    width: 100%;

    max-width: 500px;

    margin: 20px auto;

}

#lector video {

    width: 100% !important;

    border-radius: 15px;

}

#resultado {

    color: #16803c;

    font-size: 22px;

    font-weight: bold;

    margin: 15px;

    min-height: 30px;

}

.botones {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

}

button {

    border: none;

    border-radius: 10px;

    padding: 16px 28px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}

#btnCancelar {

    background: #e53935;

    color: white;

}

#mensaje {

    margin-top: 18px;

    color: #666;

}

</style>

</head>


<body>


<div class="contenedor">


    <h1>📷 ESCÁNER QR</h1>


    <div id="estado">

        ⏳ Iniciando cámara...

    </div>


    <div id="lector"></div>


    <div id="resultado"></div>


    <div class="botones">

        <button
            id="btnCancelar"
            type="button">

            ❌ Cancelar

        </button>

    </div>


    <div id="mensaje">

        Preparando cámara...

    </div>


</div>


<script>


//==================================================
// VARIABLES
//==================================================

let lectorQR = null;

let camaraActiva = false;

let procesando = false;


//==================================================
// ELEMENTOS
//==================================================

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");

const mensaje =
    document.getElementById("mensaje");

const btnCancelar =
    document.getElementById("btnCancelar");


//==================================================
// BOTÓN CANCELAR
//==================================================

btnCancelar.addEventListener(
    "click",
    cerrarCamara
);


//==================================================
// INICIAR AUTOMÁTICAMENTE
//==================================================

window.addEventListener(
    "load",
    function() {

        console.log(
            "SIGCA ESCÁNER CARGADO"
        );

        setTimeout(
            function() {

                iniciarCamara();

            },
            300
        );

    }
);


//==================================================
// INICIAR CÁMARA
//==================================================

async function iniciarCamara() {

    console.log(
        "INICIANDO CÁMARA AUTOMÁTICAMENTE"
    );


    if (camaraActiva) {

        return;

    }


    estado.textContent =
        "⏳ Iniciando cámara...";


    resultado.textContent =
        "";


    mensaje.textContent =
        "Solicitando acceso a la cámara...";


    try {


        //==========================================
        // CREAR LECTOR
        //==========================================

        if (!lectorQR) {

            lectorQR =
                new Html5Qrcode("lector");

        }


        //==========================================
        // CONFIGURACIÓN
        //==========================================

        const configuracion = {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            },

            aspectRatio: 1.0

        };


        //==========================================
        // CÁMARA TRASERA
        //==========================================

        await lectorQR.start(

            {
                facingMode: "environment"
            },

            configuracion,

            function(codigo) {

                codigoDetectado(codigo);

            },

            function(error) {

                // Errores normales de búsqueda.
                // No mostrar mensajes.

            }

        );


        //==========================================
        // CÁMARA ACTIVA
        //==========================================

        camaraActiva = true;


        estado.textContent =
            "🟢 Cámara activa";


        mensaje.textContent =
            "Coloque el código QR dentro del recuadro.";


        console.log(
            "CÁMARA INICIADA CORRECTAMENTE"
        );


    }

    catch(error) {


        console.error(
            "ERROR DE CÁMARA:",
            error
        );


        camaraActiva = false;


        estado.textContent =
            "❌ No se pudo iniciar la cámara";


        mensaje.textContent =
            error.message ||
            "Debe permitir el acceso a la cámara.";


    }

}


//==================================================
// QR DETECTADO
//==================================================

async function codigoDetectado(codigo) {


    if (procesando) {

        return;

    }


    procesando = true;


    codigo = String(codigo).trim();


    console.log(
        "QR DETECTADO:",
        codigo
    );


    //==============================================
    // MOSTRAR DNI
    //==============================================

    estado.textContent =
        "✅ Código QR leído";


    resultado.textContent =
        "DNI: " + codigo;


    mensaje.textContent =
        "Enviando DNI a SIGCA...";


    //==============================================
    // DETENER CÁMARA
    //==============================================

    await detenerCamara();


    //==============================================
    // ENVIAR A SIGCA
    //==============================================

    enviarDNI(codigo);

}


//==================================================
// DETENER CÁMARA
//==================================================

async function detenerCamara() {


    if (!lectorQR) {

        return;

    }


    try {


        if (camaraActiva) {

            await lectorQR.stop();

            console.log(
                "CÁMARA DETENIDA"
            );

        }


    }

    catch(error) {


        console.error(
            "ERROR AL DETENER CÁMARA:",
            error
        );


    }


    camaraActiva = false;

}

function enviarDNI(dni) {

    dni = String(dni).trim();

    console.log("================================");
    console.log("📱 DNI LEÍDO:", dni);
    console.log("================================");


    //================================================
    // ENVIAR AL SIGCA PADRE
    //================================================

    if (window.parent && window.parent !== window) {

        console.log(
            "✅ ESCÁNER DENTRO DE SIGCA"
        );

        window.parent.postMessage(

            {
                tipo: "SIGCA_QR",
                dni: dni
            },

            "*"

        );


        estado.textContent =
            "✅ DNI enviado a SIGCA";

        resultado.textContent =
            "DNI: " + dni;

        mensaje.textContent =
            "DNI enviado correctamente.";


        setTimeout(function() {

            console.log(
                "✅ MENSAJE ENVIADO AL PADRE"
            );

        }, 500);

        return;
    }


    //================================================
    // RESPALDO: SI SE ABRIÓ COMO VENTANA
    //================================================

    if (
        window.opener &&
        !window.opener.closed
    ) {

        window.opener.postMessage(

            {
                tipo: "SIGCA_QR",
                dni: dni
            },

            "*"

        );


        estado.textContent =
            "✅ DNI enviado a SIGCA";

        mensaje.textContent =
            "DNI enviado correctamente.";

        return;
    }


    //================================================
    // NO HAY CONEXIÓN
    //================================================

    estado.textContent =
        "⚠️ SIGCA no está conectado";

    mensaje.textContent =
        "El escáner no encontró SIGCA.";

}
//==================================================
// CERRAR ESCÁNER
//==================================================

async function cerrarCamara() {


    procesando = true;


    estado.textContent =
        "Cerrando cámara...";


    await detenerCamara();


    setTimeout(

        function() {

            window.close();

        },

        500

    );

}

</script>


</body>

</html>
