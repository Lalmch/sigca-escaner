<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner QR - SIGCA</title>

  <!-- Lector QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      text-align: center;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #0D47A1;
      margin-bottom: 10px;
    }

    #estado {
      font-weight: bold;
      margin: 15px;
      color: #333;
    }

    #lector {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      border: 4px solid #1565C0;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }

    #resultado {
      font-size: 20px;
      font-weight: bold;
      color: #0D47A1;
      margin: 15px;
      word-break: break-all;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
      font-weight: bold;
      margin: 5px;
      cursor: pointer;
    }

    .btnIniciar {
      background: #1565C0;
      color: white;
    }

    .btnCerrar {
      background: #d32f2f;
      color: white;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>📷 ESCÁNER QR</h1>

  <div id="estado">
    Presione "Iniciar cámara"
  </div>

  <div id="lector"></div>

  <div id="resultado"></div>

  <button
    class="btnIniciar"
    onclick="iniciarEscaner()">
    📷 Iniciar cámara
  </button>

  <button
    class="btnCerrar"
    onclick="cerrarEscaner()">
    ❌ Cancelar
  </button>

</div>


<script>

let html5QrCode = null;
let escaneando = false;


//==================================================
// CONTROL DEL ESCÁNER
//==================================================

let iniciandoEscaner = false;


//==================================================
// INICIAR ESCÁNER
//==================================================

function iniciarEscaner() {

  // Evitar dos procesos de cámara al mismo tiempo
  if (escaneando || iniciandoEscaner) {
    return;
  }

  iniciandoEscaner = true;

  document.getElementById("estado").textContent =
    "📷 Iniciando cámara...";

  document.getElementById("resultado").textContent = "";

  // Si existe una cámara anterior, detenerla primero
  if (html5QrCode) {

    try {

      const estadoCamara = html5QrCode.getState();

      if (
        estadoCamara === Html5QrcodeScannerState.SCANNING ||
        estadoCamara === Html5QrcodeScannerState.PAUSED
      ) {

        html5QrCode.stop()
          .then(function() {

            html5QrCode = null;
            iniciarCamaraNueva();

          })
          .catch(function() {

            html5QrCode = null;
            iniciarCamaraNueva();

          });

        return;
      }

    } catch (e) {

      html5QrCode = null;

    }
  }

  iniciarCamaraNueva();
}


//==================================================
// INICIAR CÁMARA NUEVA
//==================================================

function iniciarCamaraNueva() {

  try {

    html5QrCode = new Html5Qrcode("lector");

  } catch (error) {

    iniciandoEscaner = false;

    document.getElementById("estado").textContent =
      "❌ No se pudo preparar la cámara.";

    document.getElementById("resultado").textContent =
      error.message || error;

    return;
  }


  // Usar directamente la cámara trasera
  // Esto evita problemas con getCameras()
  html5QrCode.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      //==========================================
      // QR DETECTADO
      //==========================================

      if (!escaneando) {
        return;
      }

      escaneando = false;
      iniciandoEscaner = false;

      document.getElementById("estado").textContent =
        "✅ Código QR leído";

      document.getElementById("resultado").textContent =
        "DNI: " + decodedText;

      detenerEscaner();

      enviarDNI(decodedText);

    },

    function(errorMessage) {

      // No mostrar errores normales
      // mientras busca el código QR

    }

  )

  .then(function() {

    // IMPORTANTE:
    // Solo aquí consideramos que la cámara
    // realmente está funcionando.

    escaneando = true;
    iniciandoEscaner = false;

    document.getElementById("estado").textContent =
      "🟢 Cámara activa. Muestre el código QR.";

  })

  .catch(function(error) {

    console.error(
      "Error iniciando cámara:",
      error
    );

    escaneando = false;
    iniciandoEscaner = false;

    document.getElementById("estado").textContent =
      "❌ No se pudo acceder a la cámara.";

    document.getElementById("resultado").textContent =
      error.message || error;

    // Liberar la instancia
    try {

      if (html5QrCode) {

        const estadoCamara =
          html5QrCode.getState();

        if (
          estadoCamara === Html5QrcodeScannerState.SCANNING ||
          estadoCamara === Html5QrcodeScannerState.PAUSED
        ) {

          html5QrCode.stop()
            .catch(function() {});

        }

      }

    } catch (e) {}

    html5QrCode = null;

  });

}


//==================================================
// DETENER ESCÁNER
//==================================================

function detenerEscaner() {

  escaneando = false;

  if (!html5QrCode) {
    return Promise.resolve();
  }

  try {

    const estadoCamara =
      html5QrCode.getState();

    if (
      estadoCamara === Html5QrcodeScannerState.SCANNING ||
      estadoCamara === Html5QrcodeScannerState.PAUSED
    ) {

      return html5QrCode.stop()
        .then(function() {

          console.log("Cámara detenida");

          html5QrCode = null;

        })
        .catch(function(error) {

          console.log(
            "Error al detener cámara:",
            error
          );

          html5QrCode = null;

        });

    }

  } catch (error) {

    console.log(
      "Error comprobando cámara:",
      error
    );

  }

  html5QrCode = null;

  return Promise.resolve();

}


//==================================================
// ENVIAR DNI A SIGCA
//==================================================

function enviarDNI(dni) {

  // Enviar el DNI a la ventana principal de SIGCA

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        tipo: "SIGCA_QR",
        dni: dni
      },

      "*"

    );

    document.getElementById("estado").textContent =
      "✅ DNI enviado a SIGCA";

    setTimeout(function() {

      window.close();

    }, 800);

    return;
  }


  // Si no fue abierto desde SIGCA

  document.getElementById("estado").textContent =
    "⚠️ Escaneo completado";

}


//==================================================
// CERRAR
//==================================================

function cerrarEscaner() {

  escaneando = false;
  iniciandoEscaner = false;

  detenerEscaner()
    .finally(function() {

      setTimeout(function() {

        window.close();

      }, 300);

    });

}
