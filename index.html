<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escáner QR - SIGCA</title>

  <!-- Lector QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      text-align: center;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #0D47A1;
      margin-bottom: 10px;
    }

    #estado {
      font-weight: bold;
      margin: 15px;
      color: #333;
    }

    #lector {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      border: 4px solid #1565C0;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }

    #resultado {
      font-size: 20px;
      font-weight: bold;
      color: #0D47A1;
      margin: 15px;
      word-break: break-all;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
      font-weight: bold;
      margin: 5px;
      cursor: pointer;
    }

    .btnIniciar {
      background: #1565C0;
      color: white;
    }

    .btnCerrar {
      background: #d32f2f;
      color: white;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>📷 ESCÁNER QR</h1>

  <div id="estado">
    Presione "Iniciar cámara"
  </div>

  <div id="lector"></div>

  <div id="resultado"></div>

  <button
    class="btnIniciar"
    onclick="iniciarEscaner()">
    📷 Iniciar cámara
  </button>

  <button
    class="btnCerrar"
    onclick="cerrarEscaner()">
    ❌ Cancelar
  </button>

</div>


<script>

let html5QrCode = null;
let escaneando = false;


//==================================================
// INICIAR ESCÁNER
//==================================================

function iniciarEscaner() {

  if (escaneando) {
    return;
  }

  document.getElementById("estado").textContent =
    "Solicitando acceso a la cámara...";

  document.getElementById("resultado").textContent = "";

  html5QrCode = new Html5Qrcode("lector");

  Html5Qrcode.getCameras()
    .then(function(cameras) {

      if (!cameras || cameras.length === 0) {

        document.getElementById("estado").textContent =
          "❌ No se encontró ninguna cámara.";

        return;
      }

      // Buscar cámara trasera
      let camaraTrasera = cameras.find(function(camara) {

        const nombre =
          (camara.label || "").toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera")
        );

      });

      const camara =
        camaraTrasera || cameras[cameras.length - 1];


      escaneando = true;

      document.getElementById("estado").textContent =
        "🟢 Cámara activa. Muestre el código QR.";


      return html5QrCode.start(

        camara.id,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0

        },

        function(decodedText) {

          //==========================================
          // QR DETECTADO
          //==========================================

          if (!escaneando) {
            return;
          }

          escaneando = false;

          document.getElementById("estado").textContent =
            "✅ Código QR leído";

          document.getElementById("resultado").textContent =
            "DNI: " + decodedText;

          detenerEscaner();

          enviarDNI(decodedText);

        },

        function(errorMessage) {

          // Errores normales mientras busca el QR.
          // No mostramos nada para evitar mensajes constantes.

        }

      );

    })

    .catch(function(error) {

      console.error(error);

      escaneando = false;

      document.getElementById("estado").textContent =
        "❌ No se pudo acceder a la cámara.";

      document.getElementById("resultado").textContent =
        error.message || error;

    });

}


//==================================================
// DETENER ESCÁNER
//==================================================

function detenerEscaner() {

  if (!html5QrCode) {
    return;
  }

  html5QrCode.stop()
    .then(function() {

      console.log("Cámara detenida");

    })
    .catch(function(error) {

      console.log("Error al detener cámara:", error);

    });

}


//==================================================
// ENVIAR DNI A SIGCA
//==================================================

function enviarDNI(dni) {

  // Enviar el DNI a la ventana principal de SIGCA

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        tipo: "SIGCA_QR",
        dni: dni
      },

      "*"

    );

    document.getElementById("estado").textContent =
      "✅ DNI enviado a SIGCA";

    setTimeout(function() {

      window.close();

    }, 800);

    return;
  }


  // Si no fue abierto desde SIGCA
  document.getElementById("estado").textContent =
    "⚠️ Escaneo completado";

}


//==================================================
// CERRAR
//==================================================

function cerrarEscaner() {

  escaneando = false;

  detenerEscaner();

  setTimeout(function() {

    window.close();

  }, 500);

}

</script>

</body>
</html>
